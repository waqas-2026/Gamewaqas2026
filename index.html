<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 40 Trending Games - 2025</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 2rem;
            background: rgba(0,0,0,0.3);
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .game-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            transition: all 0.3s;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .game-thumb {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
        }

        .game-card:nth-child(8n+1) .game-thumb { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
        .game-card:nth-child(8n+2) .game-thumb { background: linear-gradient(135deg, #30cfd0 0%, #330867 100%); }
        .game-card:nth-child(8n+3) .game-thumb { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
        .game-card:nth-child(8n+4) .game-thumb { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .game-card:nth-child(8n+5) .game-thumb { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
        .game-card:nth-child(8n+6) .game-thumb { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .game-card:nth-child(8n+7) .game-thumb { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .game-card:nth-child(8n+8) .game-thumb { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }

        .game-info {
            padding: 0.8rem;
            text-align: center;
        }

        .game-info h3 {
            color: #333;
            font-size: 1rem;
            margin-bottom: 0.3rem;
        }

        .game-info p {
            color: #666;
            font-size: 0.85rem;
        }

        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .game-overlay.active { display: flex; }

        .game-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);            color: white;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-header h2 { font-size: 1.3rem; }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        .close-btn:hover { background: white; color: #667eea; }

        .game-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .game-container canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; }
            .games-grid { grid-template-columns: repeat(2, 1fr); padding: 1rem; gap: 0.8rem; }
            .game-thumb { height: 100px; font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎮 40 Trending Games 2025</h1>
        <p>All Games Work Offline • No Internet Needed</p>
    </div>

    <div class="games-grid" id="gamesGrid"></div>

    <div class="game-overlay" id="gameOverlay">
        <div class="game-header">            <h2 id="gameTitle">Game</h2>
            <button class="close-btn" onclick="closeGame()">← Back</button>
        </div>
        <div class="game-container" id="gameContainer"></div>
    </div>

    <script>
        const games = [
            { id: 'cricket', name: '🏏 Cricket', category: 'sports' },
            { id: 'football', name: '⚽ Football', category: 'sports' },
            { id: 'hockey', name: '🏑 Hockey', category: 'sports' },
            { id: 'ludo', name: '🎲 Ludo', category: 'board' },
            { id: 'carrom', name: '🔴 Carrom', category: 'board' },
            { id: 'snooker', name: '🎱 Snooker', category: 'board' },
            { id: 'patti', name: '🃏 Teen Patti', category: 'board' },
            { id: 'snake', name: '🐍 Snake', category: 'arcade' },
            { id: 'tetris', name: '📦 Tetris', category: 'puzzle' },
            { id: 'pacman', name: '👻 Pac-Man', category: 'arcade' },
            { id: 'flappy', name: '🐦 Flappy Bird', category: 'arcade' },
            { id: 'racing', name: '🏎️ Racing', category: 'arcade' },
            { id: 'shooter', name: '🚀 Shooter', category: 'arcade' },
            { id: 'puzzle', name: '🧩 Jigsaw', category: 'puzzle' },
            { id: 'memory', name: '🧠 Memory', category: 'puzzle' },
            { id: 'chess', name: '♟️ Chess', category: 'board' },
            { id: 'checkers', name: '⚫ Checkers', category: 'board' },
            { id: 'tictactoe', name: '⭕ Tic Tac Toe', category: 'board' },
            { id: 'basketball', name: '🏀 Basketball', category: 'sports' },
            { id: 'tennis', name: '🎾 Tennis', category: 'sports' },
            { id: 'golf', name: '⛳ Golf', category: 'sports' },
            { id: 'bowling', name: '🎳 Bowling', category: 'sports' },
            { id: 'fishing', name: '🎣 Fishing', category: 'arcade' },
            { id: 'cooking', name: '🍳 Cooking', category: 'arcade' },
            { id: 'dressup', name: '👗 Dress Up', category: 'arcade' },
            { id: 'painting', name: '🎨 Painting', category: 'creative' },
            { id: 'piano', name: '🎹 Piano', category: 'music' },
            { id: 'drums', name: '🥁 Drums', category: 'music' },
            { id: 'balloon', name: '🎈 Balloon', category: 'arcade' },
            { id: 'candy', name: '🍬 Candy Crush', category: 'puzzle' },
            { id: 'fruit', name: '🍉 Fruit Ninja', category: 'arcade' },
            { id: 'angry', name: '😠 Angry Birds', category: 'puzzle' },
            { id: 'subway', name: '🚇 Subway Surfers', category: 'arcade' },
            { id: 'temple', name: '🏃 Temple Run', category: 'arcade' },
            { id: 'royal', name: '👑 Royal Match', category: 'puzzle' },
            { id: 'monopoly', name: '🎩 Monopoly Go', category: 'board' },
            { id: 'among', name: '👾 Among Us', category: 'arcade' },
            { id: 'minecraft', name: '⛏️ Minecraft', category: 'arcade' },
            { id: 'roblox', name: '🎮 Roblox', category: 'arcade' },
            { id: '2048', name: '🔢 2048', category: 'puzzle' }
        ];
        let currentGame = null;
        let gameInterval = null;

        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="game-thumb">${game.name.split(' ')[0]}</div>
                <div class="game-info">
                    <h3>${game.name}</h3>
                    <p>Click to Play</p>
                </div>
            `;
            card.onclick = () => openGame(game);
            return card;
        }

        function openGame(game) {
            currentGame = game;
            document.getElementById('gameTitle').textContent = game.name;
            document.getElementById('gameOverlay').classList.add('active');
            document.getElementById('gameContainer').innerHTML = '';
            
            const container = document.getElementById('gameContainer');
            
            switch(game.id) {
                case 'cricket': loadCricket(container); break;
                case 'football': loadFootball(container); break;
                case 'hockey': loadHockey(container); break;
                case 'ludo': loadLudo(container); break;
                case 'carrom': loadCarrom(container); break;
                case 'snooker': loadSnooker(container); break;
                case 'patti': loadPatti(container); break;
                case 'snake': loadSnake(container); break;
                case 'tetris': loadTetris(container); break;
                case 'pacman': loadPacman(container); break;
                case 'flappy': loadFlappy(container); break;
                case 'racing': loadRacing(container); break;
                case 'shooter': loadShooter(container); break;
                case 'puzzle': loadPuzzle(container); break;
                case 'memory': loadMemory(container); break;
                case 'chess': loadChess(container); break;
                case 'checkers': loadCheckers(container); break;
                case 'tictactoe': loadTicTacToe(container); break;
                case 'basketball': loadBasketball(container); break;
                case 'tennis': loadTennis(container); break;
                case 'golf': loadGolf(container); break;
                case 'bowling': loadBowling(container); break;
                case 'fishing': loadFishing(container); break;
                case 'cooking': loadCooking(container); break;                case 'dressup': loadDressUp(container); break;
                case 'painting': loadPainting(container); break;
                case 'piano': loadPiano(container); break;
                case 'drums': loadDrums(container); break;
                case 'balloon': loadBalloon(container); break;
                case 'candy': loadCandyCrush(container); break;
                case 'fruit': loadFruitNinja(container); break;
                case 'angry': loadAngryBirds(container); break;
                case 'subway': loadSubwaySurfers(container); break;
                case 'temple': loadTempleRun(container); break;
                case 'royal': loadRoyalMatch(container); break;
                case 'monopoly': loadMonopolyGo(container); break;
                case 'among': loadAmongUs(container); break;
                case 'minecraft': loadMinecraft(container); break;
                case 'roblox': loadRoblox(container); break;
                case '2048': load2048(container); break;
            }
        }

        function closeGame() {
            document.getElementById('gameOverlay').classList.remove('active');
            document.getElementById('gameContainer').innerHTML = '';
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            currentGame = null;
        }

        // GAMES 1-8 (Already working)
        function loadCricket(container) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            resize();
            
            let ball = { x: canvas.width/2, y: 100, dy: 3 };
            let bat = { x: canvas.width/2, width: 80, height: 15 };
            let score = 0;
            
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                bat.x = e.clientX - rect.left - bat.width/2;
            });
                        canvas.addEventListener('click', () => {
                if (Math.abs(ball.x - (bat.x + bat.width/2)) < bat.width/2 + 10 && 
                    ball.y > canvas.height - bat.height - 20 && 
                    ball.y < canvas.height - bat.height + 20) {
                    ball.dy = -5;
                    score += 6;
                }
            });
            
            function update() {
                if (!currentGame) return;
                ctx.fillStyle = '#87CEEB';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#D2B48C';
                ctx.fillRect(canvas.width/2 - 50, 0, 100, canvas.height);
                
                ctx.fillStyle = '#8B4513';
                for (let i = -1; i <= 1; i++) {
                    ctx.fillRect(canvas.width/2 + i*15 - 3, 20, 6, 40);
                }
                
                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, 8, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(bat.x, canvas.height - 30, bat.width, bat.height);
                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('Score: ' + score, 10, 30);
                
                ball.y += ball.dy;
                if (ball.y > canvas.height) {
                    ball.y = 100;
                    ball.dy = 3 + Math.random() * 2;
                }
                
                gameInterval = setTimeout(() => requestAnimationFrame(update), 16);
            }
            update();
        }

        function loadFootball(container) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
                        function resize() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            resize();
            
            let ball = { x: canvas.width/2, y: canvas.height/2, dx: 0, dy: 0 };
            let score = 0;
            
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                ball.dx = (x - ball.x) * 0.1;
                ball.dy = (y - ball.y) * 0.1;
            });
            
            function update() {
                if (!currentGame) return;
                ctx.fillStyle = '#228B22';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#FFF';
                ctx.fillRect(canvas.width/2 - 100, 20, 200, 60);
                
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, 12, 0, Math.PI*2);
                ctx.fill();
                
                ball.x += ball.dx;
                ball.y += ball.dy;
                ball.dx *= 0.98;
                ball.dy *= 0.98;
                
                if (ball.x < 0 || ball.x > canvas.width) ball.dx *= -1;
                if (ball.y < 0 || ball.y > canvas.height) ball.dy *= -1;
                
                if (ball.y < 80 && ball.x > canvas.width/2 - 100 && ball.x < canvas.width/2 + 100) {
                    score++;
                    ball.x = canvas.width/2;
                    ball.y = canvas.height/2;
                }
                
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('Goals: ' + score, 10, 30);
                
                gameInterval = setTimeout(() => requestAnimationFrame(update), 16);
            }            update();
        }

        function loadHockey(container) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            resize();
            
            let puck = { x: canvas.width/2, y: canvas.height/2, dx: 0, dy: 0 };
            let paddle1 = { x: canvas.width/2, y: canvas.height - 50 };
            let paddle2 = { x: canvas.width/2, y: 50 };
            let score1 = 0, score2 = 0;
            
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                paddle1.x = e.clientX - rect.left;
            });
            
            function update() {
                if (!currentGame) return;
                ctx.fillStyle = '#1e3c72';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = '#FFF';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height/2);
                ctx.lineTo(canvas.width, canvas.height/2);
                ctx.stroke();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(puck.x, puck.y, 12, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(paddle1.x, paddle1.y, 25, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = '#4ecdc4';
                ctx.beginPath();
                ctx.arc(paddle2.x, paddle2.y, 25, 0, Math.PI*2);
                ctx.fill();                
                puck.x += puck.dx;
                puck.y += puck.dy;
                puck.dx *= 0.99;
                puck.dy *= 0.99;
                
                if (puck.x < 12 || puck.x > canvas.width - 12) puck.dx *= -1;
                if (puck.y < 12) { score1++; puck.x = canvas.width/2; puck.y = canvas.height/2; }
                if (puck.y > canvas.height - 12) { score2++; puck.x = canvas.width/2; puck.y = canvas.height/2; }
                
                paddle2.x += (puck.x - paddle2.x) * 0.05;
                
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 24px Arial';
                ctx.fillText(score1 + ' - ' + score2, canvas.width/2 - 30, 30);
                
                gameInterval = setTimeout(() => requestAnimationFrame(update), 16);
            }
            update();
        }

        function loadLudo(container) {
            container.innerHTML = `
                <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <div style="background:white;padding:20px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.3);">
                        <h2 style="text-align:center;margin-bottom:20px;color:#667eea;">🎲 Ludo</h2>
                        <div id="ludoBoard" style="width:400px;height:400px;background:#fff;border:3px solid #333;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);"></div>
                        <div style="text-align:center;margin-top:20px;">
                            <button onclick="rollDice()" style="padding:10px 30px;font-size:18px;background:#667eea;color:white;border:none;border-radius:10px;cursor:pointer;">Roll Dice 🎲</button>
                            <div id="diceResult" style="margin-top:10px;font-size:24px;font-weight:bold;color:#667eea;"></div>
                        </div>
                    </div>
                </div>
            `;
            
            const board = document.getElementById('ludoBoard');
            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#95e1d3'];
            
            for (let i = 0; i < 225; i++) {
                const cell = document.createElement('div');
                cell.style.border = '1px solid #ddd';
                if (i < 6 || i > 218) cell.style.background = colors[0];
                else if (i > 59 && i < 66) cell.style.background = colors[1];
                else if (i > 119 && i < 126) cell.style.background = colors[2];
                else if (i > 179 && i < 186) cell.style.background = colors[3];
                board.appendChild(cell);
            }
        }

        function rollDice() {            const dice = Math.floor(Math.random() * 6) + 1;
            document.getElementById('diceResult').textContent = '🎲 ' + dice;
        }

        function loadCarrom(container) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            
            canvas.width = 500;
            canvas.height = 500;
            
            let striker = { x: 250, y: 400, radius: 15, vx: 0, vy: 0 };
            const coins = [
                { x: 250, y: 250, radius: 10, color: '#fff' },
                { x: 230, y: 230, radius: 8, color: '#000' },
                { x: 270, y: 230, radius: 8, color: '#000' },
                { x: 250, y: 270, radius: 8, color: '#fff' }
            ];
            
            let dragging = false;
            
            canvas.addEventListener('mousedown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                if (Math.hypot(x - striker.x, y - striker.y) < striker.radius) {
                    dragging = true;
                }
            });
            
            canvas.addEventListener('mousemove', (e) => {
                if (dragging) {
                    const rect = canvas.getBoundingClientRect();
                    striker.x = e.clientX - rect.left;
                    striker.y = e.clientY - rect.top;
                }
            });
            
            canvas.addEventListener('mouseup', (e) => {
                if (dragging) {
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    striker.vx = (250 - x) * 0.1;
                    striker.vy = (400 - y) * 0.1;
                    dragging = false;
                }
            });
                        function update() {
                if (!currentGame) return;
                ctx.fillStyle = '#DEB887';
                ctx.fillRect(0, 0, 500, 500);
                
                ctx.fillStyle = '#000';
                [[25,25], [475,25], [25,475], [475,475]].forEach(([x,y]) => {
                    ctx.beginPath();
                    ctx.arc(x, y, 20, 0, Math.PI*2);
                    ctx.fill();
                });
                
                coins.forEach(coin => {
                    ctx.fillStyle = coin.color;
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#000';
                    ctx.stroke();
                });
                
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(striker.x, striker.y, striker.radius, 0, Math.PI*2);
                ctx.fill();
                
                striker.x += striker.vx;
                striker.y += striker.vy;
                striker.vx *= 0.98;
                striker.vy *= 0.98;
                
                if (striker.x < 15 || striker.x > 485) striker.vx *= -1;
                if (striker.y < 15 || striker.y > 485) striker.vy *= -1;
                
                gameInterval = setTimeout(() => requestAnimationFrame(update), 16);
            }
            update();
        }

        function loadSnooker(container) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            
            canvas.width = 700;
            canvas.height = 350;
            
            const cueBall = { x: 200, y: 175, radius: 8, vx: 0, vy: 0 };
            const balls = [];
            const colors = ['#ff0000', '#ffff00', '#000000', '#ff69b4', '#ffa500'];            
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col <= row; col++) {
                    balls.push({
                        x: 500 + row * 16,
                        y: 175 - row * 8 + col * 16,
                        radius: 8,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        vx: 0, vy: 0
                    });
                }
            }
            
            let aiming = false;
            let aimAngle = 0;
            
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                aimAngle = Math.atan2(y - cueBall.y, x - cueBall.x);
            });
            
            canvas.addEventListener('click', () => {
                if (!aiming) {
                    aiming = true;
                    cueBall.vx = Math.cos(aimAngle) * 10;
                    cueBall.vy = Math.sin(aimAngle) * 10;
                }
            });
            
            function update() {
                if (!currentGame) return;
                ctx.fillStyle = '#0d5c3b';
                ctx.fillRect(0, 0, 700, 350);
                
                ctx.fillStyle = '#000';
                [[0,0], [350,0], [700,0], [0,350], [350,350], [700,350]].forEach(([x,y]) => {
                    ctx.beginPath();
                    ctx.arc(x, y, 15, 0, Math.PI*2);
                    ctx.fill();
                });
                
                balls.forEach(ball => {
                    ctx.fillStyle = ball.color;
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();                });
                
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(cueBall.x, cueBall.y, cueBall.radius, 0, Math.PI*2);
                ctx.fill();
                
                if (!aiming) {
                    ctx.strokeStyle = '#8B4513';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(cueBall.x, cueBall.y);
                    ctx.lineTo(cueBall.x - Math.cos(aimAngle) * 100, cueBall.y - Math.sin(aimAngle) * 100);
                    ctx.stroke();
                }
                
                cueBall.x += cueBall.vx;
                cueBall.y += cueBall.vy;
                cueBall.vx *= 0.985;
                cueBall.vy *= 0.985;
                
                if (cueBall.x < 8 || cueBall.x > 692) cueBall.vx *= -1;
                if (cueBall.y < 8 || cueBall.y > 342) cueBall.vy *= -1;
                
                gameInterval = setTimeout(() => requestAnimationFrame(update), 16);
            }
            update();
        }

        function loadSnake(container) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            resize();
            
            const snake = [{x: 10, y: 10}];
            let food = {x: 15, y: 15};
            let dx = 1, dy = 0;
            let score = 0;
            const gridSize = 20;
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
                if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
                if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
                if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
            });
            
            function update() {
                if (!currentGame) return;
                
                const head = {x: snake[0].x + dx, y: snake[0].y + dy};
                snake.unshift(head);                
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    food = {
                        x: Math.floor(Math.random() * (canvas.width/gridSize)),
                        y: Math.floor(Math.random() * (canvas.height/gridSize))
                    };
                } else {
                    snake.pop();
                }
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#0f0';
                snake.forEach(seg => {
                    ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize-2, gridSize-2);
                });
                
                ctx.fillStyle = '#f00';
                ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize-2, gridSize-2);
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px Arial';
                ctx.fillText('Score: ' + score, 10, 30);
                
                gameInterval = setTimeout(() => requestAnimationFrame(update), 100);
            }
            update();
        }

        function loadSubwaySurfers(container) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            resize();
            
            let player = { x: canvas.width/2, y: canvas.height - 100, width: 40, height: 60 };
            let obstacles = [];
            let score = 0;            let lane = 1;
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' && lane > 0) lane--;
                if (e.key === 'ArrowRight' && lane < 2) lane++;
                player.x = canvas.width/2 + (lane - 1) * 100;
            });
            
            function update() {
                if (!currentGame) return;
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Roads
                ctx.fillStyle = '#555';
                for (let i = 0; i < 3; i++) {
                    ctx.fillRect(canvas.width/2 - 150 + i*100, 0, 80, canvas.height);
                }
                
                // Player
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(player.x - player.width/2, player.y, player.width, player.height);
                
                // Obstacles
                if (Math.random() < 0.02) {
                    obstacles.push({
                        x: canvas.width/2 + (Math.floor(Math.random() * 3) - 1) * 100,
                        y: -50,
                        width: 60,
                        height: 40
                    });
                }
                
                ctx.fillStyle = '#8B4513';
                obstacles.forEach((obs, i) => {
                    obs.y += 5;
                    ctx.fillRect(obs.x - obs.width/2, obs.y, obs.width, obs.height);
                    
                    if (obs.y > canvas.height) {
                        obstacles.splice(i, 1);
                        score++;
                    }
                    
                    if (Math.abs(obs.x - player.x) < 50 && Math.abs(obs.y - player.y) < 50) {
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 40px Arial';
                        ctx.fillText('Game Over!', canvas.width/2 - 120, canvas.height/2);
                        return;
                    }
                });                
                ctx.fillStyle = '#000';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('Score: ' + score, 10, 30);
                
                gameInterval = setTimeout(() => requestAnimationFrame(update), 16);
            }
            update();
        }

        function loadTempleRun(container) {
            const canvas = document.createElement('canvas');
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
            }
            resize();
            
            let player = { x: canvas.width/2, y: canvas.height/2, width: 30, height: 50 };
            let coins = [];
            let score = 0;
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') player.x -= 50;
                if (e.key === 'ArrowRight') player.x += 50;
                if (e.key === 'ArrowUp') player.y -= 50;
                if (e.key === 'ArrowDown') player.y += 50;
            });
            
            function update() {
                if (!currentGame) return;
                ctx.fillStyle = '#228B22';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Temple path
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(canvas.width/2 - 100, 0, 200, canvas.height);
                
                // Player
                ctx.fillStyle = '#ff6b6b';
                ctx.fillRect(player.x - player.width/2, player.y, player.width, player.height);
                
                // Coins
                if (Math.random() < 0.05) {
                    coins.push({
                        x: canvas.width/2 - 80 + Math.random() * 160,
                        y: -20                    });
                }
                
                ctx.fillStyle = '#FFD700';
                coins.forEach((coin, i) => {
                    coin.y += 3;
                    ctx.beginPath();
                    ctx.arc(coin.x, coin.y, 10, 0, Math.PI*2);
                    ctx.fill();
                    
                    if (Math.hypot(coin.x - player.x, coin.y - player.y) < 30) {
                        coins.splice(i, 1);
                        score++;
                    }
                    
                    if (coin.y > canvas.height) coins.splice(i, 1);
                });
                
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Arial';
                ctx.fillText('Coins: ' + score, 10, 30);
                
                gameInterval = setTimeout(() => requestAnimationFrame(update), 16);
            }
            update();
        }
