<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 40 Games Hub</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0b0f1a;color:#fff}
#hub{padding:20px;max-width:1200px;margin:0 auto}
h1{text-align:center;margin-bottom:30px;font-size:2.5em;background:linear-gradient(90deg,#38bdf8,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}
.card{background:#151b2b;border-radius:12px;overflow:hidden;cursor:pointer;transition:0.3s;border:2px solid transparent}
.card:hover{transform:translateY(-5px);border-color:#38bdf8;box-shadow:0 10px 30px rgba(56,189,248,0.3)}
.thumb{height:100px;display:flex;align-items:center;justify-content:center;font-size:3em;background:linear-gradient(135deg,#1e293b,#0f172a)}
.info{padding:10px;text-align:center}
.info h3{font-size:1em;margin-bottom:5px}
.info p{font-size:0.8em;color:#94a3b8}
.overlay{position:fixed;inset:0;background:#0b0f1a;z-index:1000;display:none;flex-direction:column}
.overlay.active{display:flex}
.bar{background:#151b2b;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
.bar h2{font-size:1.2em}
.btn{background:#38bdf8;color:#0b0f1a;border:none;padding:8px 20px;border-radius:8px;font-weight:bold;cursor:pointer}
.btn:hover{opacity:0.9}
#wrap{flex:1;position:relative}
canvas{display:block;width:100%;height:100%}
.msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:20px;border-radius:12px;text-align:center;display:none;z-index:10}
.msg.show{display:block}
</style>
</head>
<body>
<div id="hub"><h1>🎮 40 Games Hub</h1><div class="grid" id="grid"></div></div>
<div class="overlay" id="overlay"><div class="bar"><h2 id="gtitle">Game</h2><button class="btn" onclick="Hub.close()">← Back</button></div><div id="wrap"><canvas id="c"></canvas><div class="msg" id="msg"></div></div></div>
<script>
const GAMES=[
{id:'cricket',name:'Cricket',icon:'🏏',desc:'Hit sixes'},
{id:'football',name:'Football',icon:'⚽',desc:'Score goals'},
{id:'hockey',name:'Hockey',icon:'🏑',desc:'Air hockey'},
{id:'ludo',name:'Ludo',icon:'🎲',desc:'Roll dice'},
{id:'carrom',name:'Carrom',icon:'🔴',desc:'Strike coins'},
{id:'snooker',name:'Snooker',icon:'🎱',desc:'Pool game'},
{id:'patti',name:'Teen Patti',icon:'🃏',desc:'Card game'},
{id:'snake',name:'Snake',icon:'🐍',desc:'Eat & grow'},
{id:'tetris',name:'Tetris',icon:'📦',desc:'Stack blocks'},
{id:'pacman',name:'Pac-Man',icon:'👻',desc:'Eat dots'},
{id:'flappy',name:'Flappy Bird',icon:'🐦',desc:'Tap to fly'},
{id:'racing',name:'Car Racing',icon:'🏎️',desc:'Dodge cars'},
{id:'shooter',name:'Shooter',icon:'🚀',desc:'Shoot aliens'},
{id:'puzzle',name:'Puzzle',icon:'🧩',desc:'Slide puzzle'},
{id:'memory',name:'Memory',icon:'🧠',desc:'Match cards'},{id:'chess',name:'Chess',icon:'♟️',desc:'King game'},
{id:'checkers',name:'Checkers',icon:'⚫',desc:'Jump pieces'},
{id:'tictactoe',name:'Tic Tac Toe',icon:'⭕',desc:'X vs O'},
{id:'basketball',name:'Basketball',icon:'🏀',desc:'Shoot hoops'},
{id:'tennis',name:'Tennis',icon:'🎾',desc:'Pong game'},
{id:'golf',name:'Golf',icon:'⛳',desc:'Hole in one'},
{id:'bowling',name:'Bowling',icon:'🎳',desc:'Strike pins'},
{id:'fishing',name:'Fishing',icon:'🎣',desc:'Catch fish'},
{id:'cooking',name:'Cooking',icon:'🍳',desc:'Flip food'},
{id:'dressup',name:'Dress Up',icon:'👗',desc:'Style game'},
{id:'painting',name:'Painting',icon:'🎨',desc:'Draw art'},
{id:'piano',name:'Piano',icon:'🎹',desc:'Play keys'},
{id:'drums',name:'Drums',icon:'🥁',desc:'Beat maker'},
{id:'balloon',name:'Balloon',icon:'🎈',desc:'Pop balloons'},
{id:'candy',name:'Candy',icon:'🍬',desc:'Match 3'},
{id:'fruit',name:'Fruit Ninja',icon:'🍉',desc:'Slice fruits'},
{id:'angry',name:'Angry Birds',icon:'😠',desc:'Launch birds'},
{id:'subway',name:'Subway',icon:'🚇',desc:'Endless run'},
{id:'temple',name:'Temple Run',icon:'🏃',desc:'Run fast'},
{id:'royal',name:'Royal Match',icon:'👑',desc:'Match game'},
{id:'monopoly',name:'Monopoly',icon:'🎩',desc:'Buy props'},
{id:'among',name:'Among Us',icon:'👾',desc:'Find impostor'},
{id:'minecraft',name:'Minecraft',icon:'⛏️',desc:'Build world'},
{id:'roblox',name:'Roblox',icon:'🎮',desc:'Play games'},
{id:'g2048',name:'2048',icon:'🔢',desc:'Merge tiles'}
];

const Hub={
games:GAMES,current:null,ctx:null,canvas:null,raf:null,keys:{},loop:null,
init(){
this.canvas=document.getElementById('c');
this.ctx=this.canvas.getContext('2d');
this.buildGrid();
window.addEventListener('resize',()=>this.resize());
window.addEventListener('keydown',e=>this.keys[e.code]=true);
window.addEventListener('keyup',e=>this.keys[e.code]=false);
},
buildGrid(){
const g=document.getElementById('grid');
this.games.forEach((game,i)=>{
const d=document.createElement('div');
d.className='card';
d.innerHTML=`<div class="thumb">${game.icon}</div><div class="info"><h3>${game.name}</h3><p>${game.desc}</p></div>`;
d.onclick=()=>this.open(i);
g.appendChild(d);
});
},
resize(){if(this.current){const w=this.wrap.clientWidth,h=this.wrap.clientHeight;this.canvas.width=w;this.canvas.height=h;}},
open(i){
this.current=this.games[i];document.getElementById('gtitle').textContent=this.current.icon+' '+this.current.name;
document.getElementById('overlay').classList.add('active');
this.wrap=document.getElementById('wrap');
setTimeout(()=>this.resize(),10);
this.startGame();
},
startGame(){
const id=this.current.id;
const c=this.canvas,ctx=this.ctx;
let state={};

// CRICKET
if(id==='cricket'){
let ball={x:c.width/2,y:50,dy:4},bat={x:c.width/2},score=0;
c.onmousemove=e=>{const r=c.getBoundingClientRect();bat.x=e.clientX-r.left;};
c.onclick=()=>{if(Math.abs(ball.x-bat.x)<40&&ball.y>c.height-40){ball.dy=-6;score+=6;}};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
ball.y+=ball.dy;if(ball.y>c.height){ball.y=50;ball.dy=4;}
ctx.fillStyle='#22c55e';ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='#b45309';ctx.fillRect(c.width/2-40,0,80,c.height);
ctx.fillStyle='#f43f5e';ctx.beginPath();ctx.arc(ball.x,ball.y,8,0,7);ctx.fill();
ctx.fillStyle='#92400e';ctx.fillRect(bat.x-40,c.height-30,80,15);
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Score: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// FOOTBALL
else if(id==='football'){
let ball={x:c.width/2,y:c.height/2,vx:0,vy:0},score=0;
c.onclick=e=>{const r=c.getBoundingClientRect();ball.vx=(e.clientX-r.left-ball.x)*0.15;ball.vy=(e.clientY-r.top-ball.y)*0.15;};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.98;ball.vy*=0.98;
if(ball.x<0||ball.x>c.width)ball.vx*=-1;if(ball.y<0||ball.y>c.height)ball.vy*=-1;
ctx.fillStyle='#166534';ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='#fff';ctx.fillRect(c.width/2-60,20,120,40);
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,10,0,7);ctx.fill();
if(ball.y<60&&ball.x>c.width/2-60&&ball.x<c.width/2+60){score++;ball.x=c.width/2;ball.y=c.height/2;}
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Goals: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// HOCKEY
else if(id==='hockey'){
let puck={x:c.width/2,y:c.height/2,vx:3,vy:2},p1=c.width/2,p2=c.width/2,s1=0,s2=0;c.onmousemove=e=>{const r=c.getBoundingClientRect();p1=e.clientX-r.left;};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
puck.x+=puck.vx;puck.y+=puck.vy;
if(puck.x<10||puck.x>c.width-10)puck.vx*=-1;
if(puck.y<10){s2++;puck.x=c.width/2;puck.y=c.height/2;}
if(puck.y>c.height-10){s1++;puck.x=c.width/2;puck.y=c.height/2;}
p1+=(puck.x-p1)*0.1;p2+=(puck.x-p2)*0.05;
ctx.fillStyle='#1e3a8a';ctx.fillRect(0,0,c.width,c.height);
ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(0,c.height/2);ctx.lineTo(c.width,c.height/2);ctx.stroke();
ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(p1,c.height-30,25,0,7);ctx.fill();
ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(p2,30,25,0,7);ctx.fill();
ctx.fillStyle='#000';ctx.beginPath();ctx.arc(puck.x,puck.y,12,0,7);ctx.fill();
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText(s1+' - '+s2,c.width/2-20,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// SNAKE
else if(id==='snake'){
let snake=[{x:10,y:10}],food={x:15,y:15},dx=1,dy=0,score=0,last=0,grid=20;
this.loop=()=>{
const t=performance.now();if(t-last<100)return;last=t;
if(this.keys['ArrowUp']&&dy===0){dx=0;dy=-1;}
if(this.keys['ArrowDown']&&dy===0){dx=0;dy=1;}
if(this.keys['ArrowLeft']&&dx===0){dx=-1;dy=0;}
if(this.keys['ArrowRight']&&dx===0){dx=1;dy=0;}
const head={x:snake[0].x+dx,y:snake[0].y+dy};
snake.unshift(head);
if(head.x===food.x&&head.y===food.y){score+=10;food={x:Math.floor(Math.random()*(c.width/grid)),y:Math.floor(Math.random()*(c.height/grid))};}else snake.pop();
ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='#22c55e';snake.forEach(s=>ctx.fillRect(s.x*grid,s.y*grid,grid-2,grid-2));
ctx.fillStyle='#ef4444';ctx.fillRect(food.x*grid,food.y*grid,grid-2,grid-2);
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Score: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// TIC TAC TOE
else if(id==='tictactoe'){
let board=Array(9).fill(''),turn='X',win=false;
c.onclick=e=>{
const r=c.getBoundingClientRect(),sz=Math.min(c.width,c.height)/3,col=Math.floor((e.clientX-r.left)/sz),row=Math.floor((e.clientY-r.top)/sz),i=row*3+col;
if(!board[i]&&!win){board[i]=turn;turn=turn==='X'?'O':'X';}
};
this.loop=()=>{
const sz=Math.min(c.width,c.height)/3;
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);board.forEach((v,i)=>{const r=Math.floor(i/3),col=i%3;ctx.strokeStyle='#475569';ctx.lineWidth=4;ctx.strokeRect(col*sz,r*sz,sz,sz);
if(v){ctx.fillStyle='#fff';ctx.font='bold 50px Arial';ctx.textAlign='center';ctx.fillText(v,col*sz+sz/2,r*sz+sz/2+15);}});
ctx.textAlign='start';
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// LUDO
else if(id==='ludo'){
let dice=1,turn=0;
c.onclick=()=>{dice=Math.floor(Math.random()*6)+1;turn=(turn+1)%4;};
this.loop=()=>{
ctx.fillStyle='#f0f9ff';ctx.fillRect(0,0,c.width,c.height);
const sz=Math.min(c.width,c.height)*0.6,ox=(c.width-sz)/2,oy=(c.height-sz)/2;
ctx.fillStyle='#fff';ctx.fillRect(ox,oy,sz,sz);
ctx.strokeStyle='#334155';ctx.strokeRect(ox,oy,sz,sz);
for(let i=0;i<4;i++){ctx.fillStyle=['#ef4444','#3b82f6','#eab308','#22c55e'][i];ctx.fillRect(ox+i*sz/4,oy,sz/4,sz/4);}
ctx.fillStyle='#000';ctx.font='bold 40px Arial';ctx.textAlign='center';ctx.fillText('🎲 '+dice,c.width/2,c.height/2+10);
ctx.fillStyle='#64748b';ctx.font='16px Arial';ctx.fillText('Turn: '+['Red','Blue','Yellow','Green'][turn],c.width/2,c.height-20);
ctx.textAlign='start';
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// CARROM
else if(id==='carrom'){
let striker={x:c.width/2,y:c.height-50,vx:0,vy:0},coins=[{x:c.width/2,y:c.height/2,r:10,c:'#fff'},{x:c.width/2-20,y:c.height/2-20,r:8,c:'#000'},{x:c.width/2+20,y:c.height/2-20,r:8,c:'#000'}],drag=false;
c.onmousedown=e=>{const r=c.getBoundingClientRect();if(Math.hypot(e.clientX-r.left-striker.x,e.clientY-r.top-striker.y)<20)drag=true;};
c.onmousemove=e=>{if(drag){const r=c.getBoundingClientRect();striker.x=e.clientX-r.left;striker.y=e.clientY-r.top;}};
c.onmouseup=e=>{if(drag){drag=false;striker.vx=(c.width/2-striker.x)*0.1;striker.vy=(c.height-50-striker.y)*0.1;}};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
striker.x+=striker.vx;striker.y+=striker.vy;striker.vx*=0.98;striker.vy*=0.98;
if(striker.x<15||striker.x>c.width-15)striker.vx*=-1;if(striker.y<15||striker.y>c.height-15)striker.vy*=-1;
ctx.fillStyle='#d4a373';ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='#000';[[15,15],[c.width-15,15],[15,c.height-15],[c.width-15,c.height-15]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],15,0,7);ctx.fill();});
coins.forEach(coin=>{ctx.fillStyle=coin.c;ctx.beginPath();ctx.arc(coin.x,coin.y,coin.r,0,7);ctx.fill();});
ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(striker.x,striker.y,15,0,7);ctx.fill();
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// SNOOKER
else if(id==='snooker'){
let cueBall={x:150,y:200,vx:0,vy:0},balls=[],aim=0;
for(let r=0;r<4;r++)for(let col=0;col<=r;col++)balls.push({x:400+r*18,y:200-r*9+col*18,r:9,c:['#ef4444','#eab308','#22c55e','#3b82f6'][Math.floor(Math.random()*4)],vx:0,vy:0});
c.onmousemove=e=>{const r=c.getBoundingClientRect();aim=Math.atan2(e.clientY-r.top-cueBall.y,e.clientX-r.left-cueBall.x);};c.onclick=()=>{if(!cueBall.vx){cueBall.vx=Math.cos(aim)*10;cueBall.vy=Math.sin(aim)*10;}};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
cueBall.x+=cueBall.vx;cueBall.y+=cueBall.vy;cueBall.vx*=0.98;cueBall.vy*=0.98;
if(cueBall.x<8||cueBall.x>c.width-8)cueBall.vx*=-1;if(cueBall.y<8||cueBall.y>c.height-8)cueBall.vy*=-1;
balls.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vx*=0.98;b.vy*=0.98;if(b.x<8||b.x>c.width-8)b.vx*=-1;if(b.y<8||b.y>c.height-8)b.vy*=-1;});
ctx.fillStyle='#064e3b';ctx.fillRect(0,0,c.width,c.height);
balls.forEach(b=>{ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();});
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cueBall.x,cueBall.y,8,0,7);ctx.fill();
ctx.strokeStyle='#92400e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cueBall.x,cueBall.y);ctx.lineTo(cueBall.x-Math.cos(aim)*80,cueBall.y-Math.sin(aim)*80);ctx.stroke();
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// TEEN PATTI
else if(id==='patti'){
let cards=[],chips=1000;
c.onclick=()=>{cards=[];for(let i=0;i<3;i++)cards.push({v:['A','K','Q','J','10','9'][Math.floor(Math.random()*6)],s:['♠','♥','♦','♣'][Math.floor(Math.random()*4)]});};
this.loop=()=>{
ctx.fillStyle='#0f172a';ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.fillText('💰 '+chips,c.width/2,40);
cards.forEach((card,i)=>{const cx=c.width/2+(i-1)*80,cy=c.height/2;ctx.fillStyle='#fff';ctx.fillRect(cx-30,cy-45,60,90);ctx.fillStyle=card.s==='♥'||card.s==='♦'?'#ef4444':'#000';ctx.font='20px Arial';ctx.fillText(card.v+card.s,cx,cy+5);});
ctx.fillStyle='#94a3b8';ctx.font='14px Arial';ctx.fillText('Click to Deal',c.width/2,c.height-20);ctx.textAlign='start';
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// TETRIS
else if(id==='tetris'){
const cols=10,rows=20,sz=30;
let grid=Array(rows).fill().map(()=>Array(cols).fill(0)),piece=[[1,1,1,1]],px=4,py=0,score=0,last=0;
this.loop=()=>{
const t=performance.now();if(t-last<500)return;last=t;
py++;
ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle='#38bdf8';piece.forEach((row,r)=>row.forEach((cell,c)=>{if(cell)ctx.fillRect((px+c)*sz,(py+r)*sz,sz-1,sz-1);}));
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Score: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// PACMAN
else if(id==='pacman'){
let p={x:1,y:1},ghosts=[{x:8,y:8},{x:2,y:8}],dots=[],score=0;
for(let y=0;y<10;y++)for(let x=0;x<10;x++)if((x+y)%2===0)dots.push({x,y});
const gsz=Math.min(c.width,c.height)/12;
this.loop=()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
if(this.keys['ArrowUp']&&p.y>0)p.y--;if(this.keys['ArrowDown']&&p.y<9)p.y++;
if(this.keys['ArrowLeft']&&p.x>0)p.x--;if(this.keys['ArrowRight']&&p.x<9)p.x++;
ghosts.forEach(g=>{const m=[[0,1],[0,-1],[1,0],[-1,0]][Math.floor(Math.random()*4)];g.x=Math.max(0,Math.min(9,g.x+m[0]));g.y=Math.max(0,Math.min(9,g.y+m[1]));});
dots=dots.filter(dot=>{if(dot.x===p.x&&dot.y===p.y){score+=10;return false;}return true;});
dots.forEach(dot=>{ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(dot.x*gsz+gsz/2,dot.y*gsz+gsz/2,gsz/4,0,7);ctx.fill();});
ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(p.x*gsz+gsz/2,p.y*gsz+gsz/2,gsz/2,0,7);ctx.fill();
ghosts.forEach(g=>{ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(g.x*gsz+gsz/2,g.y*gsz+gsz/2,gsz/2,0,7);ctx.fill();});
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Score: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// FLAPPY BIRD
else if(id==='flappy'){
let bird={y:c.height/2,vy:0},pipes=[],score=0,frame=0;
c.onclick=c.ontouchstart=()=>{bird.vy=-7;};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
bird.vy+=0.4;bird.y+=bird.vy;frame++;
if(frame%80===0){const gap=150,ty=Math.random()*(c.height-gap-100)+50;pipes.push({x:c.width,top:ty,bot:ty+gap,w:60});}
pipes.forEach(p=>{p.x-=3;if(p.x+p.w<0)pipes.shift();});
if(bird.y>c.height||bird.y<0){this.showMsg('Crash! Score: '+score,'Retry');return;}
pipes.forEach(p=>{if(bird.y<p.top||bird.y>p.bot){if(bird.x+15>p.x&&bird.x-15<p.x+p.w){this.showMsg('Hit! Score: '+score,'Retry');return;}}if(p.x===20)score++;});
ctx.fillStyle='#38bdf8';ctx.fillRect(0,0,c.width,c.height);
pipes.forEach(p=>{ctx.fillStyle='#22c55e';ctx.fillRect(p.x,0,p.w,p.top);ctx.fillRect(p.x,p.bot,p.w,c.height-p.bot);});
ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(bird.x,bird.y,15,0,7);ctx.fill();
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Score: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);

else if(id==='fruit'){
let fruits=[],score=0,drag=false;
setInterval(()=>fruits.push({x:Math.random()*c.width,y:c.height,vy:-Math.random()*5-5,r:20,c:['#ef4444','#eab308','#22c55e'][Math.floor(Math.random()*3)]}),1000);
c.onmousedown=e=>{drag=true;const r=c.getBoundingClientRect();};
c.onmousemove=e=>{if(drag){const r=c.getBoundingClientRect();fruits.forEach(f=>{if(Math.hypot(f.x-(e.clientX-r.left),f.y-(e.clientY-r.top))<f.r)f.cut=true;});}};
c.onmouseup=()=>drag=false;
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
fruits.forEach(f=>{f.y+=f.vy;f.vy+=0.2;});fruits=fruits.filter(f=>{if(f.cut){score++;return false;}return f.y<c.width;});
fruits.forEach(f=>{ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();});
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Sliced: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// ANGRY BIRDS
else if(id==='angry'){
let bird={x:100,y:c.height-100,vx:0,vy:0},blocks=[{x:c.width-150,y:c.height-50,w:30,h:50},{x:c.width-100,y:c.height-50,w:30,h:50}],drag=false;
c.onmousedown=e=>{drag=true;};c.onmouseup=e=>{if(drag){drag=false;const r=c.getBoundingClientRect();bird.vx=(e.clientX-r.left-bird.x)*0.15;bird.vy=(e.clientY-r.top-bird.y)*0.15;}};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
bird.vy+=0.3;bird.x+=bird.vx;bird.y+=bird.vy;
blocks.forEach(b=>{if(bird.x>b.x&&bird.x<b.x+b.w&&bird.y>b.y&&bird.y<b.y+b.h){b.hit=true;bird.vx*=0.5;bird.vy*=0.5;}});
ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#166534';ctx.fillRect(0,c.height-30,c.width,30);
blocks.forEach(b=>{ctx.fillStyle=b.hit?'#94a3b8':'#b45309';ctx.fillRect(b.x,b.y,b.w,b.h);});
ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(bird.x,bird.y,15,0,7);ctx.fill();this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// SUBWAY
else if(id==='subway'){
let player={lane:1},obs=[],score=0,spd=6;
setInterval(()=>obs.push({lane:Math.floor(Math.random()*3),y:-50}),1000);
c.onclick=e=>{const r=c.getBoundingClientRect();if(e.clientX-r.left<c.width/3)player.lane=0;else if(e.clientX-r.left<c.width*2/3)player.lane=1;else player.lane=2;};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
obs.forEach(o=>o.y+=spd);obs=obs.filter(o=>{if(o.y>c.height){score++;return false;}if(o.lane===player.lane&&o.y>c.height-80&&o.y<c.height-20){this.showMsg('Hit! Score: '+score,'Retry');return false;}return true;});
ctx.fillStyle='#fbbf24';ctx.fillRect(0,0,c.width,c.height);
for(let i=0;i<3;i++){const lx=c.width/3*i+player.lane===i?c.width/6:c.width/3;ctx.fillStyle='#cbd5e1';ctx.fillRect(lx,0,c.width/3-10,c.height);}
obs.forEach(o=>{ctx.fillStyle='#ef4444';ctx.fillRect(c.width/3*o.lane+10,o.y,c.width/3-20,60);});
ctx.fillStyle='#3b82f6';ctx.fillRect(c.width/3*player.lane+15,c.height-80,c.width/3-30,60);
ctx.fillStyle='#000';ctx.font='bold 20px Arial';ctx.fillText('Score: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// TEMPLE RUN
else if(id==='temple'){
let player={x:c.width/2},coins=[],score=0,spd=5;
setInterval(()=>coins.push({x:Math.random()*(c.width-40)+20,y:-20}),800);
c.onclick=e=>{const r=c.getBoundingClientRect();player.x=e.clientX-r.left;};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
coins.forEach(c=>c.y+=spd);coins=coins.filter(c=>{if(c.y>c.height)return false;if(Math.hypot(c.x-player.x,c.y-(c.height-50))<30){score++;return false;}return true;});
ctx.fillStyle='#92400e';ctx.fillRect(0,0,c.width,c.height);
coins.forEach(c=>{ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(c.x,c.y,10,0,7);ctx.fill();});
ctx.fillStyle='#ef4444';ctx.fillRect(player.x-15,c.height-60,30,60);
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Coins: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// ROYAL MATCH
else if(id==='royal'){
let grid=Array(25).fill().map(()=>Math.floor(Math.random()*5)),score=0;
c.onclick=e=>{const r=c.getBoundingClientRect(),sz=50,col=Math.floor((e.clientX-r.left-50)/sz),row=Math.floor((e.clientY-r.top-50)/sz);if(col<0||col>4||row<0||row>4)return;const i=row*5+col;grid[i]=(grid[i]+1)%5;score+=5;};
this.loop=()=>{
const sz=50,ox=50,oy=50;const cols=['#ef4444','#3b82f6','#eab308','#22c55e','#a855f7'];
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
grid.forEach((v,i)=>{const r=Math.floor(i/5),col=i%5;ctx.fillStyle=cols[v];ctx.fillRect(ox+col*sz,oy+r*sz,sz-4,sz-4);});
ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('Score: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);};
this.loop();
}

// MONOPOLY
else if(id==='monopoly'){
let pos=0,money=1000,roll=0;
c.onclick=()=>{roll=Math.floor(Math.random()*6)+1;pos=(pos+roll)%20;if(pos===0)money+=200;else money-=50;};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
for(let i=0;i<20;i++){const a=(i/20)*Math.PI*2-Math.PI/2,x=c.width/2+Math.cos(a)*150,y=c.height/2+Math.sin(a)*150;ctx.fillStyle=i===pos?'#fbbf24':'#334155';ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.fill();}
ctx.fillStyle='#fff';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.fillText('$'+money,c.width/2,c.height/2);ctx.fillText('Roll: '+roll,c.width/2,c.height/2+40);ctx.textAlign='start';
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// AMONG US
else if(id==='among'){
let crew=['👨‍','👩‍🚀','🧑‍','👽'],impostor=3,found=false;
c.onclick=e=>{const r=c.getBoundingClientRect(),i=Math.floor((e.clientX-r.left)/(c.width/4));if(i===impostor){found=true;this.showMsg('🎉 Found Impostor!','Back');}else this.showMsg('❌ Wrong!','Back');};
this.loop=()=>{
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
crew.forEach((c,i)=>{ctx.fillStyle='#1e293b';ctx.fillRect(i*(c.width/4)+10,c.height/2-50,c.width/4-20,100);ctx.font='50px Arial';ctx.textAlign='center';ctx.fillText(c,i*(c.width/4)+c.width/8,c.height/2+10);});ctx.textAlign='start';
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// MINECRAFT
else if(id==='minecraft'){
let world=Array(20).fill().map(()=>Array(20).fill(0)),sel=1;
c.onclick=e=>{const r=c.getBoundingClientRect(),sz=30,col=Math.floor((e.clientX-r.left)/sz),row=Math.floor((e.clientY-r.top)/sz);if(row<20&&col<20)world[row][col]=sel;};
this.loop=()=>{
const sz=30;const cols=['#000','#8B4513','#228B22','#87CEEB'];
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
world.forEach((row,r)=>row.forEach((v,c)=>{ctx.fillStyle=cols[v];ctx.fillRect(c*sz,r*sz,sz-1,sz-1);}));
ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText('Click to Place Block',10,20);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// ROBLOX
else if(id==='roblox'){
let games=['🏘️ Brookhaven','🍎 Blox Fruits',' Adopt Me','🏎️ Racing'],sel=0;
c.onclick=()=>sel=(sel+1)%games.length;
this.loop=()=>{
ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);
games.forEach((g,i)=>{ctx.fillStyle=i===sel?'#38bdf8':'#334155';ctx.fillRect(c.width/2-100,c.height/2-60+i*50,200,40);ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.textAlign='center';ctx.fillText(g,c.width/2,c.height/2-35+i*50);});ctx.fillText('Click to Select',c.width/2,c.height-20);ctx.textAlign='start';
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

// 2048
else if(id==='g2048'){
let grid=Array(16).fill(0),score=0;
function add(){const empty=grid.map((v,i)=>v===0?i:-1).filter(i=>i!==-1);if(empty.length)grid[empty[Math.floor(Math.random()*empty.length)]]=2;}
add();add();
c.onclick=()=>{grid=grid.map(v=>v?Math.min(v*2,2048):0);score+=10;add();};
this.loop=()=>{
const sz=Math.min(c.width,c.height)/4.5,ox=(c.width-sz*4)/2,oy=(c.height-sz*4)/2;const cols={0:'#cdc1b4',2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
ctx.fillStyle='#0b0f1a';ctx.fillRect(0,0,c.width,c.height);
grid.forEach((v,i)=>{const r=Math.floor(i/4),col=i%4;ctx.fillStyle=cols[v]||'#3c3a32';ctx.fillRect(ox+col*sz+5,oy+r*sz+5,sz-10,sz-10);if(v){ctx.fillStyle='#776e65';ctx.font='bold 24px Arial';ctx.textAlign='center';ctx.fillText(v,ox+col*sz+sz/2,oy+r*sz+sz/2+8);}});
ctx.fillStyle='#776e65';ctx.font='bold 20px Arial';ctx.textAlign='start';ctx.fillText('Score: '+score,10,30);
this.raf=requestAnimationFrame(this.loop);
};
this.loop();
}

else{this.showMsg('Coming Soon!','Back');}
},
close(){
if(this.raf)cancelAnimationFrame(this.raf);
this.loop=null;
this.current=null;
document.getElementById('overlay').classList.remove('active');
document.getElementById('msg').classList.remove('show');
this.canvas.onmousemove=null;
this.canvas.onclick=null;
this.canvas.onmousedown=null;
this.canvas.onmouseup=null;
this.canvas.ontouchstart=null;
this.canvas.ontouchmove=null;
}
};

window.addEventListener('DOMContentLoaded',()=>{Hub.init();});
</script>
</body>
</html>
